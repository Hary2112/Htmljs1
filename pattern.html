<html>
    <head>
        <script>
        
            function Pattern(){
                var n=document.getElementById("num").value;
                var s="";
                for(let i=1;i<=n;i++){
                    for (let j=1;j<=i;j++){
                        s=s+"* "
                    }
                    s=s+"<br>"
                }
                document.getElementById("pat").innerHTML=s;
            } 
            function Pattern2(){
                var n=document.getElementById("num").value;
                var s='';
                for(let i=1;i<=n;i++){
                    s=s+'&nbsp'
                    for (let j=1;j<=n-i;j++){
                        s=s+'&nbsp'
                    }
                    for(let k=1;k<=i;k++){
                        s=s+'*'+'&nbsp'
                    }
                    s=s+"<br>"
                }
                document.getElementById("pat").innerHTML=s;
            }

            let age=15;
            let msg=(age>=18)?"Adult":"Minor";
            console.log(msg);

            let m=95;
            let grade=(m>=90)?"A":(m>=80)?"B":(m>=70)?"C":(m>=60)?"D":"F";
            console.log(grade);

        </script>

    </head>
    <body>
        <input type="number" id="num" placeholder="Enter a Number">
        <button type="submit" onclick="Pattern()">Pattern</button>
        <button type="submit" onclick="Pattern2()">Pattern2</button>
        <h2 id="pat"></h2>
    </body>
</html>
