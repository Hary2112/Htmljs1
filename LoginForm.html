<html>
    <head>
        <link href="Logincss.css" rel="stylesheet">

    </head>
    <body>
        <div class="login-box">
            <h1>Login</h1>
            <form id="loginform">
            <div class="input-box">
                <input type="text" id="username" placeholder="Username"/>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password"/>
            </div>
            <div class="input-box">
                <button type="submit">Submit</button>
            </div>
            <p id="msg"></p>
            </form>
            <script src="Loginjs.js"></script>

        </div>
        
    </body>
</html>
