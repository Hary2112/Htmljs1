            function square(b){
                return b*b;
            }
            //Function Expression
            let Mul=function(k,l,m){
                return k*l*m;
            }
            //Arrow Function
            let powerfour=(m)=> m*m*m*m;


            f1();

            f2(3);

            console.log(square(10));

            console.log(Mul(5,6,7));

            console.log(powerfour(5));
